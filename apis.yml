aid: mirage
name: Mirage
description: >-
  Mirage is an AI research company headquartered in New York City that builds
  Captions, an AI video editor and generator used by more than 20 million
  creators, small businesses, and enterprises worldwide. The Mirage Video API
  exposes the company's state-of-the-art video models over a simple HTTP
  interface: generate expressive human video from an image and audio (Mirage
  Video 1), apply styled captions to an existing video, synthesize speech with
  text-to-speech voices, and render meta text overlays. It is an asynchronous
  submit-and-poll REST API authenticated with an x-api-key header and priced by
  usage (per minute of captioning, per second of generated video).
